name: Vastera
description: Vastera, Inc. was a global trade management (GTM) software and managed-services
  company headquartered in Dulles, Virginia. Its solutions automated the trade-management
  processes tied to the physical movement of goods across international borders — import/export
  documentation, licensing and classification, compliance and tax requirements, inventory
  management, and payment tracking. A Battery Ventures portfolio company, Vastera went public
  on Nasdaq in 2000 and was acquired by JPMorgan Chase Bank, N.A. for $3.00 per share
  (approximately $129 million), effective April 1, 2005, becoming JPMorgan Chase Vastera. It
  no longer operates independently and publishes no public website or APIs; the vastera.com
  domain remains registered but is configured for email only.
